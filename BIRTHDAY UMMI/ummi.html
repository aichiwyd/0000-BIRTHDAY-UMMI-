<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background-image: url("ummi0000.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .center-image {
            width: 25%;
            height: auto;
            cursor: pointer;
        }

        /* Image overlay */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;

            background-color: rgba(0, 0, 0, 0.7);

            justify-content: center;
            align-items: center;
        }

        .overlay img {
            max-width: 80%;
            max-height: 80%;
            cursor: pointer;
        }

        /* Pop-up animation */
        .pop-animation {
            animation: popIn 0.5s ease-out;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            70% {
                transform: scale(1.1);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <!-- First clickable image -->
    <img
        src="ummi0002.png"
        class="center-image"
        alt="Open image"
        onclick="openImage()"
    >

    <!-- Image overlay -->
    <div class="overlay" id="imageOverlay">

        <img
            id="overlayImage"
            src="ummi0003.jpg"
            alt="Next image"
            onclick="nextImage(event)"
        >

    </div>

    <script>

        function openImage() {
            document.getElementById("imageOverlay").style.display = "flex";
        }

        function nextImage(event) {
            event.stopPropagation();

            const image = document.getElementById("overlayImage");

            if (image.src.includes("ummi0003.jpg")) {

                image.src = "ummi0004.jpg";

            }
            else if (image.src.includes("ummi0004.jpg")) {

                image.src = "ummi0006.png";

                // Trigger pop-up animation
                image.classList.remove("pop-animation");

                void image.offsetWidth;

                image.classList.add("pop-animation");

            }
            else if (image.src.includes("ummi0006.png")) {

                // Open the online website
                window.location.href =
                    "https://sendthesong.xyz/details/6ac7cfbf22c3da55691c1f2c";
            }
        }

        // Clicking outside the image closes the overlay
        document.getElementById("imageOverlay").onclick = function () {
            this.style.display = "none";
        };

    </script>

</body>

</html>
